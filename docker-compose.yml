services:
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt/live/example.com/fullchain.pem:/etc/letsencrypt/live/example.com/fullchain.pem:ro
      - /etc/letsencrypt/live/example.com/privkey.pem:/etc/letsencrypt/live/example.com/privkey.pem:ro
    depends_on:
      - web
      - api

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    restart: always
    environment:
      - NODE_ENV=production
      - API_INTERNAL_URL=http://api:8000
      # Nginx 经 Docker 内网转发过来：信任内网地址带来的 X-Forwarded-For
      - TRUSTED_PROXIES=127.0.0.1,::1,172.16.0.0/12,10.0.0.0/8,192.168.0.0/16
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    restart: always
    env_file:
      - .env
    environment:
      # 只有 Nginx 与 Nitro（Docker 内网）带来的 X-Forwarded-For 才可信，用于登录限流与审计
      - TRUSTED_PROXIES=127.0.0.1,::1,172.16.0.0/12,10.0.0.0/8,192.168.0.0/16
    volumes:
      - ./data:/app/data

  scheduler:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    restart: "no"
    command: ["python", "-m", "app.cli"]
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    depends_on:
      - api
